name: API tests

on:
  push:
    branches: [feature/mvp-foundation]
  pull_request:
    branches: [feature/mvp-foundation]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U opspilot -d opspilot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://opspilot:opspilot@localhost:5432/opspilot
      JWT_SECRET: ci-test-secret
      TEST_DATABASE_URL: postgresql+psycopg://opspilot:opspilot@localhost:5432/opspilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Apply database migrations
        env:
          PGPASSWORD: opspilot
        run: |
          for file in database/migrations/*.sql; do
            echo "Applying $file"
            psql -h localhost -U opspilot -d opspilot -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Run pytest
        working-directory: apps/api
        run: pytest -q
      - name: Start API
        run: |
          uvicorn app.main:app --app-dir apps/api --host 127.0.0.1 --port 8000 > /tmp/opspilot-api.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
      - name: API smoke test
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/api_smoke_test.py
      - name: API logs on failure
        if: failure()
        run: cat /tmp/opspilot-api.log || true
